[package]
name = "pf-cli"
version = "0.1.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context", "suggestions", "color", "wrap_help"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy", "query"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4"] }

[[bin]]
name = "pf"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
