# Tagging vX.Y.Z publishes a release with a prebuilt binary per target, so
# installing needs no Rust toolchain.
#
# The tests are not repeated here: the tag is cut from a commit that ci.yml
# already ran on every supported platform.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fails the release if CHANGELOG.md has no section for this tag, which is
      # the cheapest way to stop an unannotated version going out.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from Apple silicon rather than built on an Intel
          # runner. Apple's toolchain handles it cleanly, aws-lc-sys included,
          # and it keeps both macOS targets on the best-supported label.
          # (`macos-15-intel` exists if a native build is ever wanted; the old
          # `macos-13` does not, and a job asking for it queues forever.)
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Linux arm64 needs an `ubuntu-*-arm` runner: free on public repos,
          # billed on private ones. Uncomment once that suits.
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: pf
          target: ${{ matrix.target }}
          locked: true
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
