# SHA-pinned actions do not float, so something has to move them: without this,
# pinning just means running a stale action forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait before adopting a new release. Bumping the moment one is published
    # would pull in a compromised version before anyone could yank it, which is
    # the same risk the SHA pins exist to bound.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
